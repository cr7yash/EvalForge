[project]
name = "evalforge"
version = "1.2.1"
description = "LLM Evaluation & Benchmarking Platform — measure accuracy, performance, and cost across language models"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.78.0",
    "fastapi>=0.128.3",
    "httpx>=0.28.1",
    "nltk>=3.9.2",
    "numpy>=2.4.2",
    "openai>=2.17.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.2",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
